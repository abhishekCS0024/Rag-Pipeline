[project]
name = "rag-platform"
version = "0.1.0"
description = "Asynchronous RAG pipeline: document ingestion, chunking, embedding, retrieval and generation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    "pika>=1.3",
    "docling>=2.5",
    "openai>=1.54",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "src*", "infrastructure*"]
namespaces = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
    "e2e: full-stack tests requiring docker-compose services to be running",
]
